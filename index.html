<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Lenete Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="./manifest.json">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

  <!-- Header / Barra Superior -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20 px-4 py-4 shadow-lg">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl shadow-lg shadow-blue-500/30">
          ⚡
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
            Lenete Store
            <span class="text-[10px] bg-blue-900/60 text-blue-300 border border-blue-700/50 px-2 py-0.5 rounded-full font-mono">Oficial</span>
          </h1>
          <p class="text-xs text-slate-400">Catálogo de herramientas y juegos</p>
        </div>
      </div>

      <!-- Buscador -->
      <div class="w-full sm:w-72">
        <input type="text" id="searchInput" placeholder="Buscar en mis apps..." 
               class="w-full bg-slate-800 text-xs border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- Filtros de Categoría -->
    <div class="flex gap-2 overflow-x-auto pb-2 mb-6 no-scrollbar" id="categoryFilters">
      <button onclick="filterCat('todos', this)" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-blue-600 text-white transition">Todas</button>
      <button onclick="filterCat('Herramientas', this)" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Herramientas</button>
      <button onclick="filterCat('Juegos', this)" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Juegos</button>
      <button onclick="filterCat('Productividad', this)" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Productividad</button>
    </div>

    <!-- Rejilla de Apps -->
    <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-12 text-slate-500 text-xs">Cargando aplicaciones...</div>
    </div>
  </main>

  <!-- Modal de Ficha de Aplicación -->
  <div id="appModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>
      
      <div class="flex items-center gap-4 mb-4">
        <!-- Se usará el icono de 512px para mayor nitidez en el modal -->
        <img id="modalIcon" src="" class="w-16 h-16 rounded-2xl object-cover bg-slate-800 border border-slate-700">
        <div>
          <h2 id="modalTitle" class="text-lg font-bold text-white"></h2>
          <span id="modalAuthor" class="text-xs text-blue-400 font-medium"></span>
          <div class="mt-1">
            <span id="modalCategory" class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700"></span>
          </div>
        </div>
      </div>

      <p id="modalDesc" class="text-xs text-slate-300 mb-6 leading-relaxed"></p>

      <div class="flex justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 text-xs font-medium rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">Cerrar</button>
        <a id="modalLaunchBtn" href="#" target="_blank" class="px-4 py-2 text-xs font-medium rounded-xl bg-blue-600 hover:bg-blue-500 text-white flex items-center gap-1.5 shadow-lg shadow-blue-600/20">
          <span>Ejecutar PWA</span> ↗
        </a>
      </div>
    </div>
  </div>

  <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800/60 mt-auto">
    Lenete Store • Todos los derechos reservados.
  </footer>

  <script>
    let myApps = [];
    let currentCategory = 'todos';

    // Función para cargar los datos desde apps.json
    async function loadAppsData() {
      try {
        const response = await fetch('./apps.json');
        if (!response.ok) throw new Error('No se pudo cargar el archivo apps.json');
        myApps = await response.json();
        renderApps(myApps);
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('appGrid').innerHTML = `<div class="col-span-full text-center py-12 text-red-400 text-xs">Error al cargar el catálogo de aplicaciones. Asegúrate de abrir la tienda mediante un servidor local o un entorno web.</div>`;
      }
    }

    function renderApps(list) {
      const grid = document.getElementById('appGrid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">No se encontraron aplicaciones.</div>`;
        return;
      }

      list.forEach(app => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition cursor-pointer group shadow-lg";
        card.onclick = () => openModal(app);
        card.innerHTML = `
          <div>
            <div class="flex items-start gap-3">
              <!-- Icono de 192px para la tarjeta -->
              <img src="${app.icon192}" alt="${app.nombre}" class="w-12 h-12 rounded-xl bg-slate-800 object-cover border border-slate-700 group-hover:border-blue-500/50 transition">
              <div class="flex-1 min-w-0">
                <h3 class="font-bold text-white text-sm truncate">${app.nombre}</h3>
                <span class="inline-block bg-slate-800 text-slate-400 border border-slate-700 text-[10px] px-2 py-0.5 rounded-full mt-1">
                  v${app.version}
                </span>
              </div>
            </div>
            <p class="text-xs text-slate-400 mt-3 line-clamp-2 leading-relaxed">${app.descripcion}</p>
          </div>
          <div class="mt-4 flex justify-between items-center pt-3 border-t border-slate-800/60 text-xs">
            <span class="text-[10px] text-slate-500 font-mono">${app.categoria}</span>
            <span class="text-blue-400 font-medium group-hover:translate-x-1 transition duration-200">Abrir app →</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(app) {
      document.getElementById('modalIcon').src = app.icon512;
      document.getElementById('modalTitle').textContent = app.nombre;
      document.getElementById('modalAuthor').textContent = `Lenete Games • v${app.version}`;
      document.getElementById('modalCategory').textContent = app.categoria;
      document.getElementById('modalDesc').textContent = app.descripcion;
      document.getElementById('modalLaunchBtn').href = app.url;

      document.getElementById('appModal').classList.remove('hidden');
      document.getElementById('appModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('appModal').classList.add('hidden');
      document.getElementById('appModal').classList.remove('flex');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const baseList = currentCategory === 'todos' ? myApps : myApps.filter(a => a.categoria === currentCategory);
      const filtered = baseList.filter(a => 
        a.nombre.toLowerCase().includes(term) || 
        a.descripcion.toLowerCase().includes(term) ||
        a.categoria.toLowerCase().includes(term)
      );
      renderApps(filtered);
    });

    function filterCat(cat, btnElement) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition";
      });
      if(btnElement) {
        btnElement.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-blue-600 text-white transition";
      }

      document.getElementById('searchInput').value = ''; // Limpiar búsqueda al cambiar categoría

      if (cat === 'todos') {
        renderApps(myApps);
      } else {
        renderApps(myApps.filter(a => a.categoria === cat));
      }
    }

    // Registro del Service Worker de la tienda
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker de la Tienda registrado:', reg.scope))
          .catch(err => console.error('Error registrando Service Worker:', err));
      });
    }

    // Carga inicial ejecutando la petición al apps.json
    loadAppsData();
  </script>
</body>
</html>
